<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helpful</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/Logo.png')}}">


  
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap');
    
      * {
          margin: 0;
          padding: 0;
          font-family: "Nunito Sans", serif;
      }
    
      body {
        background-color: #eeeeee;
      }
    
      .sections-button-border {
        border: 0.1px solid #ececec;
        width: 200px; /* Fixed width */
        height: 200px; /* Fixed height */
        padding: 10px; /* Consistent padding */
        box-sizing: border-box;
        display: inline-block;
        text-align: center;
        overflow: hidden;
        border-radius: 1.5vh; 
        background-color: #fff; 
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); 
        transition: all 0.3s ease;
        margin-bottom: 5%;
      }
    
      .sections-button-border:hover {
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25); 
        transform: translateY(-5px); 
      }
    
      .sections-button-border img {
        max-width: 100%;
        max-height: 100%; /* Ensure the image fits within the button */
        display: block;
        margin: auto; /* Center the image */
      }
    
      .sections-button-border h4 {
        margin-top: 10px;
        margin-bottom: 0;
      }
    
      hr {
        width: 75%;
        height: 2px; 
        background-color: black; /* Ensure it's set to black */
      }
    </style>
    

    <!--Bootstrap Links-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</head>
<body>
  <center>
    <hr>
    <h2 style="font-weight: bolder; margin-bottom: 1%;">Helpful Links</h2>
  </center>
    <div class="container text-center">
        <div class="row align-items-end">
          <div class="col">
            <div class="sections-button-border" onclick="location.href='/badges#dropdown';" style="cursor:pointer;">
              <img src="{{ url_for('static', filename='images/helpful/badge.png')}}" width="75%" alt="Staged Emergency Aid Badge">
              <br>
              <h5>Section Badges</h5>
            </div>
          </div>
          <div class="col">
            <div class="sections-button-border" onclick="location.href='/send';" style="cursor:pointer;">
              <img src="{{ url_for('static', filename='images/helpful/OSM.jpg')}}" width="75%" alt="Logo - Online Scout Manager - With additional text - '4th East Grinstead Waiting List'">
              <br>
              <h5>Form</h5>
            </div>
          </div>
          <div class="col">
            <div class="sections-button-border" onclick="location.href='/badges#placements';" style="cursor:pointer;">
              <img src="{{ url_for('static', filename='images/helpful/district.jpg')}}" alt="District/ County Badge">
              <br>
              <h5>Badge Placement</h5>
            </div>
          </div>
        </div>
      </div>
</body>
