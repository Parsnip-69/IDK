<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helpful</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/Logo.png')}}">

    <style>
      .sections-button-border {
        border: 3px solid #000;
        width: auto;
        height: 30vh; /* Set a fixed height for all boxes */
        padding: 2.5%;
        box-sizing: border-box;
        display: inline-block;
        text-align: center;
        overflow: hidden; 
        border-radius: 1.5vh;
      }

      .sections-button-border img {
        max-width: 100%;
        height: auto;
        display: block;
        margin-left: auto;
        margin-right: auto;
      }

      .sections-button-border h4 {
        margin-top: 10px;
        margin-bottom: 0;
      }


      .sections-button-border:hover{
        border:3.5px solid firebrick;
      }
    </style>

    <!--Bootstrap Links-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container text-center">
        <div class="row align-items-end">
          <div class="col">
            <div class="sections-button-border" onclick="location.href='/badges#Beavers-Img';" style="cursor:pointer;">
              <img src="https://prod-cms.scouts.org.uk/media/1290/staged-emergency-aid.svg" alt="Staged Emergency Aid Badge">
              <br><br>
              <h4>Avaliable Badges</h4>
            </div>
          </div>
          <div class="col">
            <div class="sections-button-border" onclick="location.href='http://www.onlinescoutmanager.co.uk/waiting-list/4th-east-grinstead-waiting-list/6789a6e2-d7e4-4342-ad3f-70bd71993ccd/apply';" style="cursor:pointer;">
              <img src="{{ url_for('static', filename='images/helpful/OSM.jpg')}}" width="75%" alt="Logo - Online Scout Manager - With additional text - '4th East Grinstead Waiting List'">
              <br><br>
              <h4>Join Us Form</h4>
            </div>
          </div>
          <div class="col">
            <div class="sections-button-border" onclick="location.href='https://prod-cms.scouts.org.uk/media/15129/2-beaver_uniform-diagrams_sept2021_portrait.png';" style="cursor:pointer;">
              <img src="{{ url_for('static', filename='images/helpful/district.jpg')}}" alt="District/ County Badge">
              <br><br>
              <h4>Badge Placement</h4>
            </div>
          </div>
        </div>
      </div>
</body>
